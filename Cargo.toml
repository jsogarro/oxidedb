[package]
name = "oxidedb"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"

# REPL dependencies
rustyline = "14.0"
colored = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Performance
rayon = "1.7"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
pretty_assertions = "1.4"

[[bench]]
name = "performance"
harness = false